<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>11:11 • A Special Wish For Chasmish ✨</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@400;700;900&family=Plus+Jakarta+Sans:wght@300;400;500;600;700&family=Sacramento&display=swap" rel="stylesheet">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        cinzel: ['Cinzel Decorative', 'serif'],
                        sans: ['Plus Jakarta Sans', 'sans-serif'],
                        cursive: ['Sacramento', 'cursive']
                    },
                    colors: {
                        starlight: '#FFFDF0',
                        solargold: '#FFD700',
                        rosegold: '#F4A261',
                        astralviolet: '#7B2CBF',
                        cosmicdeep: '#070314',
                        nebula: '#1A0B2E'
                    }
                }
            }
        }
    </script>
    <style>
        * { user-select: none; -webkit-tap-highlight-color: transparent; }
        body { background-color: #070314; color: #FFFDF0; overflow-x: hidden; font-family: 'Plus Jakarta Sans', sans-serif; }
        #celestial-canvas { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; z-index: 0; pointer-events: none; }
        .glass-orb {
            background: radial-gradient(135% 135% at 50% 10%, rgba(255, 255, 255, 0.12) 0%, rgba(123, 44, 191, 0.08) 50%, rgba(7, 3, 20, 0.6) 100%);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 215, 0, 0.25);
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.7), inset 0 0 25px rgba(255, 215, 0, 0.1), 0 0 30px rgba(123, 44, 191, 0.25);
        }
        .gold-glow-text {
            background: linear-gradient(135deg, #FFFDF0 0%, #FFD700 45%, #F4A261 80%, #FFD700 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            filter: drop-shadow(0 0 12px rgba(255, 215, 0, 0.4));
        }
        .aurora-ring {
            position: absolute; border-radius: 50%; border: 1px solid rgba(255, 215, 0, 0.3); animation: rotateRing 18s linear infinite;
        }
        @keyframes rotateRing { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
        @keyframes pulseGlow {
            0%, 100% { transform: scale(1); opacity: 0.8; filter: drop-shadow(0 0 15px rgba(255,215,0,0.5)); }
            50% { transform: scale(1.03); opacity: 1; filter: drop-shadow(0 0 30px rgba(255,215,0,0.9)); }
        }
        .animate-pulse-glow { animation: pulseGlow 3s ease-in-out infinite; }
        ::-webkit-scrollbar { width: 5px; }
        ::-webkit-scrollbar-track { background: rgba(7, 3, 20, 0.8); }
        ::-webkit-scrollbar-thumb { background: rgba(255, 215, 0, 0.3); border-radius: 10px; }
    </style>
</head>
<body class="min-h-screen flex flex-col justify-between items-center relative px-4 py-6">

    <canvas id="celestial-canvas"></canvas>

    <header class="w-full max-w-4xl flex justify-between items-center z-10 py-2">
        <div class="flex items-center space-x-2">
            <span class="w-2.5 h-2.5 rounded-full bg-solargold animate-ping"></span>
            <span class="text-xs tracking-widest text-solargold font-cinzel font-semibold uppercase opacity-90">11:11 Celestial Portal</span>
        </div>
        <button id="audio-btn" class="glass-orb px-4 py-2 rounded-full text-xs font-semibold text-solargold hover:text-white transition
