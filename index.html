<!DOCTYPE html>
<html lang="en">

        :root {

            --glass-bg: rgba(15, 15, 35, 0.65);
            --glass-border: rgba(255, 255, 255, 0.15);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            user-select: none;
        }

        body {
            background-color: var(--bg-deep);
            color: #ffffff;
            font-family: 'Plus Jakarta Sans', sans-serif;
            min-height: 100vh;
            overflow-x: hidden;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            position: relative;
        }

        canvas#bgCanvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
            pointer-events: none;
        }

        .container {
            position: relative;
            z-index: 10;
            width: 90%;
            max-width: 500px;
            text-align: center;
            padding: 2.5rem 1.5rem;
            background: var(--glass-bg);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid var(--glass-border);
            border-radius: 32px;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.5),
                        0 0 40px rgba(192, 132, 252, 0.15);
            transition: transform 0.4s ease, box-shadow 0.4s ease;
        }

        .header-tag {
            font-family: 'Cinzel', serif;
            letter-spacing: 4px;
            font-size: 0.85rem;
            color: var(--accent-cyan);
            text-transform: uppercase;
            margin-bottom: 1rem;
            opacity: 0.9;
        }

        .time-display {
            font-family: 'Cinzel', serif;
            font-size: 3.5rem;
            font-weight: 700;
            background: linear-gradient(135deg, #ffffff 0%, var(--accent-gold) 50%, var(--accent-purple) 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 0.5rem;
            text-shadow: 0 0 30px rgba(251, 191, 36, 0.3);
        }

        .date-display {
            font-size: 0.95rem;
            color: #a1a1aa;
            margin-bottom: 2rem;
            letter-spacing: 1px;
        }

            height: 160px;
            margin: 0 auto 2rem auto;
            cursor: pointer;
        }
